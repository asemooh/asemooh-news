<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asemooh | Ghana News & Updates</title>
<meta name="description" content="Asemooh brings you the latest news, headlines and trending stories from Ghana and beyond.">
<style>
:root{--ink:#101828;--muted:#667085;--line:#e4e7ec;--bg:#f5f7fa;--gold:#e6b84a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial}
header{background:#101828;color:#fff;padding:22px max(18px,calc((100% - 1120px)/2));border-bottom:4px solid var(--gold)}
.brand{font-size:30px;font-weight:900;letter-spacing:1px}.tag{color:#d0d5dd;font-size:13px}
nav{background:#fff;border-bottom:1px solid var(--line);padding:10px max(18px,calc((100% - 1120px)/2));font-size:13px;font-weight:700;color:#475467}
main{max-width:1120px;margin:24px auto;padding:0 16px}.intro{margin:0 0 18px}.intro h1{font-size:25px;margin:0 0 4px}.intro p{margin:0;color:var(--muted)}
#feed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.media{width:100%;aspect-ratio:16/9;object-fit:cover;background:#e4e7ec}.cardbody{padding:15px;display:flex;flex-direction:column;flex:1}
.type{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:#9a6b00}.card h2{font-size:19px;line-height:1.3;margin:6px 0}.excerpt{color:#475467;margin:0 0 14px;font-size:14px}
.date{color:var(--muted);font-size:12px;margin-top:auto}.read{display:inline-block;margin-top:12px;color:#101828;font-weight:800;text-decoration:none}
.empty{background:#fff;border:1px solid var(--line);padding:24px;border-radius:12px;color:var(--muted);grid-column:1/-1}
article.full{max-width:820px;margin:0 auto;background:white;padding:24px;border:1px solid var(--line);border-radius:14px}
article.full h1{font-size:clamp(26px,4vw,40px);line-height:1.15;margin:8px 0}
article.full .story{white-space:pre-wrap;line-height:1.8;margin-top:20px}
article.full img{width:100%;height:auto;max-height:520px;object-fit:cover;border-radius:10px;margin:16px 0}
.back{display:inline-block;margin-bottom:16px;color:#101828;font-weight:700;text-decoration:none}
footer{text-align:center;color:var(--muted);font-size:12px;padding:32px 16px}
@media(max-width:850px){#feed{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){#feed{grid-template-columns:1fr}.brand{font-size:26px}main{margin-top:18px}}
</style>
</head>
<body>
<header><div class="brand">ASEMOOH</div><div class="tag">Ghana news · Trending stories · Current affairs</div></header>
<nav>HOME　 /　 LATEST NEWS　 /　 GHANA & BEYOND</nav>
<main>
<section class="intro" id="intro"><h1>Latest News</h1><p>Stay informed with the stories making headlines.</p></section>
<div id="feed"><div class="empty">Loading the latest Asemooh stories…</div></div>
</main>
<footer>© <span id="year"></span> Asemooh. All rights reserved.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script>
(async()=>{
 const cfg=window.SUPABASE_CONFIG||window.supabaseConfig||window.supabase_config||{};
 const url=cfg.url||cfg.supabaseUrl||window.SUPABASE_URL;
 const key=cfg.anonKey||cfg.publishableKey||cfg.supabaseAnonKey||window.SUPABASE_ANON_KEY;
 const feed=document.getElementById('feed');document.getElementById('year').textContent=new Date().getFullYear();
 if(!url||!key){feed.innerHTML='<div class="empty">Asemooh is being configured. Please check back soon.</div>';return}
 const db=window.supabase.createClient(url,key);
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const date=s=>s?new Date(s).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'';
 const params=new URLSearchParams(location.search),slug=params.get('story');
 if(slug){
   const {data,error}=await db.from('articles').select('title,slug,excerpt,body,content_type,image_url,video_url,created_at').eq('slug',slug).eq('status','published').maybeSingle();
   if(error||!data){feed.innerHTML='<div class="empty">This story could not be found or is no longer available.</div>';return}
   document.getElementById('intro').classList.add('hidden');
   const video=data.video_url?`<p><a href="${esc(data.video_url)}" target="_blank" rel="noopener">Watch the video</a></p>`:'';
   feed.style.display='block';
   feed.innerHTML=`<article class="full"><a class="back" href="./">← Back to latest news</a><div class="type">${esc(data.content_type||'News')}</div><h1>${esc(data.title)}</h1><div class="date">${esc(date(data.created_at))}</div>${data.image_url?`<img src="${esc(data.image_url)}" alt="${esc(data.title)}">`:''}${video}<p class="excerpt">${esc(data.excerpt||'')}</p><div class="story">${esc(data.body||'')}</div></article>`;
   document.title= data.title+' | Asemooh';return;
 }
 const {data,error}=await db.from('articles').select('title,slug,excerpt,content_type,image_url,created_at').eq('status','published').order('created_at',{ascending:false}).limit(30);
 if(error){feed.innerHTML='<div class="empty">We could not load the news right now. Please refresh the page.</div>';return}
 if(!data||!data.length){feed.innerHTML='<div class="empty">No published stories yet. New Asemooh updates will appear here.</div>';return}
 feed.innerHTML=data.map(a=>`<article class="card">${a.image_url?`<img class="media" src="${esc(a.image_url)}" alt="${esc(a.title)}" loading="lazy">`:`<div class="media"></div>`}<div class="cardbody"><div class="type">${esc(a.content_type||'News')}</div><h2>${esc(a.title)}</h2><p class="excerpt">${esc(a.excerpt||'')}</p><div class="date">${esc(date(a.created_at))}</div><a class="read" href="?story=${encodeURIComponent(a.slug||'')}">Read story →</a></div></article>`).join('');
})();
</script>
</body></html>
